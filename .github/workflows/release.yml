name: Release Plugin

on:
  push:
    branches: [main]
    paths-ignore:
      - '**/*.md'
      - '**/*.mdx'
      - 'docs/**'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-plugin
  queue: max
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout plugin
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - name: Build, verify and publish each pending commit
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # Activation boundary only; later runs use plugin.json.releaseSource.
          RELEASE_BASE_SHA: 80979bd6f604ab915ddf64a285164e7bfa0124ec
        run: node scripts/release-plugin.mjs
